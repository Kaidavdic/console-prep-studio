name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 ffmpeg

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # The end-to-end test seeds a torrent to itself on localhost, which can be
      # flaky on shared runners. Informational until it proves stable.
      - name: End-to-end self-test
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/selftest.py

  package:
    name: package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ConsolePrepStudio-windows
          - os: macos-latest
            artifact: ConsolePrepStudio-macos
          - os: ubuntu-latest
            artifact: ConsolePrepStudio-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name ConsolePrepStudio
          --collect-binaries libtorrent
          --collect-submodules keyring.backends
          --paths src app_main.py

      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../${{ matrix.artifact }}.zip" ConsolePrepStudio
          else
            tar -czf "../${{ matrix.artifact }}.tar.gz" ConsolePrepStudio*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
