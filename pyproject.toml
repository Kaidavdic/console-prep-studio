[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "console-prep-studio"
version = "0.3.0"
description = "Download a torrent episode-by-episode, convert each for a handheld/console, delete the source as it goes, then push the batch over the network."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "libtorrent>=2.0.9",
    "paramiko>=3.4",
    "scp>=0.14",
    "smbprotocol>=1.12",
    "keyring>=24",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[project.scripts]
cps = "cps.cli:main"

[project.gui-scripts]
console-prep-studio = "cps.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
